<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roland RNG - Premium Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: #020205; color: white;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 20px; position: relative;
        }

        /* ☰ 메뉴 버튼 */
        .menu-btn {
            position: absolute; top: 15px; left: 15px; z-index: 100;
            background: rgba(15, 15, 25, 0.85); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff;
            font-size: 22px; width: 44px; height: 44px; border-radius: 12px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            backdrop-filter: blur(12px); box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: all 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .menu-btn:active { transform: scale(0.92); }

        /* 👈 사이드바 메뉴 */
        .sidebar {
            position: fixed; top: 0; left: -290px; width: 270px; height: 100vh;
            background: rgba(10, 10, 18, 0.95); border-right: 1px solid rgba(255, 255, 255, 0.1); z-index: 200;
            display: flex; flex-direction: column; padding: 60px 20px 20px; gap: 12px;
            backdrop-filter: blur(20px); transition: left 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
            box-shadow: 15px 0 35px rgba(0,0,0,0.8);
        }
        .sidebar.open { left: 0; }

        .sidebar-title { font-size: 18px; font-weight: 800; color: #ff3344; margin-bottom: 5px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 12px; letter-spacing: 1px; }
        .sidebar-item {
            background: rgba(25, 25, 40, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); color: #eee;
            padding: 14px 18px; border-radius: 12px; font-size: 14px; font-weight: 700;
            cursor: pointer; text-align: left; transition: all 0.2s; display: flex; align-items: center; gap: 10px;
        }
        .sidebar-item:active { background: #ff3344; color: #fff; border-color: #ff3344; }

        .sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); z-index: 150; backdrop-filter: blur(4px);
        }
        .sidebar-overlay.active { display: block; }

        /* 배경 네온 앰비언트 광원 */
        #ambient-glow {
            position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%);
            width: 350px; height: 350px; border-radius: 50%;
            background: radial-gradient(circle, rgba(136, 136, 136, 0.2) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none; z-index: 1; transition: background 0.8s ease;
        }

        /* 캔버스 및 아우라 연출 */
        #aura-canvas-container {
            position: absolute; top: 38%; left: 50%;
            transform: translate(-50%, -50%);
            width: 500px; height: 500px;
            pointer-events: none; z-index: 2;
            display: flex; justify-content: center; align-items: center;
        }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        #character-avatar {
            width: 64px; height: 64px; background: #ffffff;
            border-radius: 50%; z-index: 5;
            box-shadow: 0 0 45px rgba(255, 255, 255, 0.9); transition: all 0.5s ease;
        }

        /* 타이틀 디스플레이 */
        .main-display {
            z-index: 10; text-align: center; display: flex; flex-direction: column;
            align-items: center; justify-content: center; margin-top: 240px;
        }
        .aura-title {
            font-size: 42px; font-weight: 900; letter-spacing: 2px;
            margin-bottom: 8px; text-shadow: 0 0 30px currentColor;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            word-break: keep-all;
        }
        .aura-rarity {
            font-size: 16px; font-weight: 800; color: #ddd;
            background: rgba(0, 0, 0, 0.75); padding: 6px 22px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* 하단 컨트롤 영역 */
        .control-panel { z-index: 10; margin-bottom: 25px; width: 100%; max-width: 340px; }
        .roll-btn {
            background: linear-gradient(135deg, #2b2b3d, #12121c);
            color: #fff; border: 2px solid #00ffcc; padding: 18px 0;
            font-size: 26px; font-weight: 900; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.35); transition: all 0.15s ease; width: 100%;
            letter-spacing: 1px;
        }
        .roll-btn:active { transform: scale(0.94); }

        /* 모달 시스템 */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); z-index: 999; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #11111a; border: 1px solid rgba(255, 255, 255, 0.12); width: 90%; max-width: 420px;
            border-radius: 24px; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        /* 보스전 캔버스 영역 */
        #spider-box {
            position: relative; width: 320px; height: 320px;
            border: 2px solid #ff3344; background: #080305; margin: 12px auto;
            box-shadow: 0 0 30px rgba(255, 51, 68, 0.3); border-radius: 12px; overflow: hidden;
        }
        .attack-action-btn {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #ff3344; color: #fff; border: none; padding: 12px 28px; font-size: 18px;
            font-weight: 900; border-radius: 30px; cursor: pointer; box-shadow: 0 0 25px #ff3344;
            transition: transform 0.1s;
        }
        .attack-action-btn:active { transform: translate(-50%, -50%) scale(0.92); }

        @media (max-width: 768px) {
            #aura-canvas-container { width: 360px; height: 360px; top: 34%; }
            #character-avatar { width: 50px; height: 50px; }
            .main-display { margin-top: 180px; }
            .aura-title { font-size: 32px; }
        }
    </style>
</head>
<body>

    <button id="menu-toggle-btn" class="menu-btn">☰</button>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-title">메뉴 (Menu)</div>
        <button id="nav-inv" class="sidebar-item">📖 오라 도감</button>
        <button id="nav-boss" class="sidebar-item" style="color:#ff3344; border-color:rgba(255,51,68,0.4);">⚔️ 거미집 보스전</button>
    </div>

    <div id="ambient-glow"></div>

    <div id="aura-canvas-container">
        <canvas id="auraCanvas" width="500" height="500"></canvas>
        <div id="character-avatar"></div>
    </div>

    <div class="main-display">
        <div id="aura-name" class="aura-title" style="color: #888;">ROLL을 눌러주세요</div>
        <div id="aura-rarity" class="aura-rarity">1 / 1</div>
    </div>

    <div class="control-panel">
        <button id="roll-btn" class="roll-btn">ROLL</button>
    </div>

    <!-- 도감 모달 -->
    <div id="inv-modal" class="modal">
        <div class="modal-content">
            <h3 style="color:#00ffcc; text-align:center; margin-bottom:15px; font-size:20px;">📖 획득한 오라 도감</h3>
            <div id="inv-list" style="max-height:260px; overflow-y:auto; padding-right:5px;"></div>
            <button id="close-inv" style="width:100%; margin-top:18px; padding:12px; background:#222; color:#fff; border:1px solid #444; border-radius:12px; font-weight:bold; cursor:pointer;">닫기</button>
        </div>
    </div>

    <!-- 보스전 모달 -->
    <div id="boss-modal" class="modal">
        <div class="modal-content" style="text-align:center;">
            <h3 style="color:#ff3344; font-size:20px; letter-spacing:1px;">🕸️ 거미집의 아비들</h3>
            <div id="boss-stage-text" style="font-size:13px; color:#aaa; margin:6px 0; font-weight:bold;">단계 1 / 3</div>
            <div id="spider-box">
                <canvas id="spiderCanvas" width="320" height="320"></canvas>
                <button id="boss-slash-btn" class="attack-action-btn">🗡️ 베기!</button>
            </div>
            <div id="boss-msg" style="font-size:13px; color:#fff; margin-top:10px; font-weight:bold;">공격을 피하세요!</div>
            <button id="close-boss-btn" style="margin-top:14px; padding:10px 24px; background:#1e1e28; color:#aaa; border:1px solid #444; border-radius:20px; font-weight:bold; cursor:pointer;">도망치기</button>
        </div>
    </div>

    <script>
        // 1. 오라 데이터 세팅
        const AURAS = [
            { name: "Common", chance: 2, color: "#a0a0a0", size: 2 },
            { name: "Uncommon", chance: 4, color: "#55ff55", size: 2.5 },
            { name: "Good", chance: 8, color: "#55ffff", size: 3 },
            { name: "Natural", chance: 16, color: "#88ff88", size: 3 },
            { name: "Rare", chance: 32, color: "#5555ff", size: 3.5 },
            { name: "Divinus", chance: 64, color: "#ffff55", size: 4 },
            { name: "Rage", chance: 256, color: "#ff3333", size: 4.5 },
            { name: "JACKPOT", chance: 7777, color: "#00ffaa", size: 5 },
            { name: "Roland: Absolute", chance: 100000000, color: "#ff0000", size: 6 }
        ];

        let inventory = {};
        let currentAura = AURAS[0];

        // 2. 메뉴 제어 로직
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const menuBtn = document.getElementById('menu-toggle-btn');

        menuBtn.onclick = () => {
            sidebar.classList.add('open');
            overlay.classList.add('active');
        };

        overlay.onclick = () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        };

        document.getElementById('nav-inv').onclick = () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
            const listEl = document.getElementById('inv-list');
            listEl.innerHTML = '';
            AURAS.forEach(a => {
                const count = inventory[a.name] || 0;
                listEl.innerHTML += `<div style="display:flex; justify-between; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.08); font-size:14px;">
                    <span style="color:${a.color}; font-weight:bold;">${a.name}</span>
                    <span style="color:#aaa;">${count}개</span>
                </div>`;
            });
            document.getElementById('inv-modal').style.display = 'flex';
        };

        document.getElementById('close-inv').onclick = () => {
            document.getElementById('inv-modal').style.display = 'none';
        };

        // 3. 고퀄리티 파티클 캔버스 이펙트 엔진
        const auraCanvas = document.getElementById('auraCanvas');
        const ctx = auraCanvas.getContext('2d');
        let particles = [];

        function initParticles() {
            particles = [];
            const count = 35;
            for(let i = 0; i < count; i++) {
                particles.push({
                    angle: Math.random() * Math.PI * 2,
                    radius: 40 + Math.random() * 80,
                    speed: 0.015 + Math.random() * 0.025,
                    size: 1.5 + Math.random() * 3,
                    yOffset: (Math.random() - 0.5) * 30,
                    alpha: 0.2 + Math.random() * 0.8
                });
            }
        }
        initParticles();

        function drawAuraEffect() {
            ctx.clearRect(0, 0, 500, 500);

            // 중앙 링 오라 렌더링
            ctx.save();
            ctx.translate(250, 250);
            
            // 회전 오라 고리
            ctx.beginPath();
            ctx.arc(0, 0, 65, 0, Math.PI * 2);
            ctx.strokeStyle = currentAura.color;
            ctx.lineWidth = 3;
            ctx.shadowColor = currentAura.color;
            ctx.shadowBlur = 20;
            ctx.globalAlpha = 0.6;
            ctx.stroke();

            // 파티클 궤적 드로잉
            particles.forEach((p, idx) => {
                p.angle += p.speed;
                const x = Math.cos(p.angle) * p.radius;
                const y = Math.sin(p.angle) * p.radius + p.yOffset;

                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = currentAura.color;
                ctx.shadowColor = currentAura.color;
                ctx.shadowBlur = 12;
                ctx.globalAlpha = p.alpha;
                ctx.fill();
            });

            ctx.restore();
            requestAnimationFrame(drawAuraEffect);
        }
        drawAuraEffect();

        // 4. ROLL 뽑기 애니메이션 연동
        const rollBtn = document.getElementById('roll-btn');
        const nameEl = document.getElementById('aura-name');
        const rarityEl = document.getElementById('aura-rarity');
        const avatar = document.getElementById('character-avatar');
        const glow = document.getElementById('ambient-glow');

        rollBtn.onclick = () => {
            let selected = AURAS[0];
            for (let i = AURAS.length - 1; i >= 0; i--) {
                if (Math.random() < (1 / AURAS[i].chance)) {
                    selected = AURAS[i];
                    break;
                }
            }
            currentAura = selected;
            inventory[selected.name] = (inventory[selected.name] || 0) + 1;

            // 글자 팝 애니메이션
            nameEl.style.transform = 'scale(1.15)';
            setTimeout(() => { nameEl.style.transform = 'scale(1)'; }, 150);

            nameEl.innerText = selected.name;
            nameEl.style.color = selected.color;
            rarityEl.innerText = `1 / ${selected.chance.toLocaleString()}`;
            avatar.style.boxShadow = `0 0 50px ${selected.color}`;
            avatar.style.borderColor = selected.color;

            glow.style.background = `radial-gradient(circle, ${selected.color}33 0%, rgba(0,0,0,0) 70%)`;
        };

        // 5. 거미집 보스전 미니게임 엔진
        let bossRunning = false, stage = 1, bossHp = 100, player = {x: 160, y: 160}, lines = [], timer = 0, isAttack = false;
        const spiderCanvas = document.getElementById('spiderCanvas');
        const sCtx = spiderCanvas.getContext('2d');
        const slashBtn = document.getElementById('boss-slash-btn');

        document.getElementById('nav-boss').onclick = () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
            startBoss();
        };

        function startBoss() {
            bossRunning = true; stage = 1; bossHp = 100; lines = []; timer = 0; isAttack = false;
            document.getElementById('boss-modal').style.display = 'flex';
            slashBtn.style.display = 'none';
            document.getElementById('boss-msg').innerText = "공격을 피하세요!";
            document.getElementById('boss-msg').style.color = "#fff";
            bossLoop();
        }

        document.getElementById('close-boss-btn').onclick = () => {
            bossRunning = false;
            document.getElementById('boss-modal').style.display = 'none';
        };

        const movePlayer = (e) => {
            if (!bossRunning) return;
            const rect = spiderCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            player.x = Math.max(6, Math.min(314, clientX - rect.left));
            player.y = Math.max(6, Math.min(314, clientY - rect.top));
        };

        spiderCanvas.addEventListener('mousemove', movePlayer);
        spiderCanvas.addEventListener('touchmove', (e) => { movePlayer(e); e.preventDefault(); }, { passive: false });

        function bossLoop() {
            if (!bossRunning) return;
            timer++;
            sCtx.clearRect(0, 0, 320, 320);

            // 거미줄 연출 배경
            sCtx.strokeStyle = 'rgba(255, 51, 68, 0.12)';
            sCtx.lineWidth = 1;
            for(let i = 1; i <= 4; i++) {
                sCtx.beginPath();
                sCtx.arc(160, 160, i * 35, 0, Math.PI * 2);
                sCtx.stroke();
            }

            if (timer % Math.max(8, 26 - stage * 5) === 0 && !isAttack) {
                const angle = Math.random() * Math.PI;
                lines.push({
                    x1: 160 + Math.cos(angle) * 200, y1: 160 + Math.sin(angle) * 200,
                    x2: 160 - Math.cos(angle) * 200, y2: 160 - Math.sin(angle) * 200,
                    warn: 20, active: 7, width: 2 + stage
                });
            }

            if (timer > 210 && !isAttack) {
                isAttack = true;
                slashBtn.style.display = 'block';
                document.getElementById('boss-msg').innerText = "틈이 열렸다! 지금 베어라!";
                document.getElementById('boss-msg').style.color = "#00ffcc";
            }

            lines.forEach((l, idx) => {
                sCtx.beginPath();
                sCtx.moveTo(l.x1, l.y1);
                sCtx.lineTo(l.x2, l.y2);

                if (l.warn > 0) {
                    l.warn--;
                    sCtx.strokeStyle = 'rgba(255, 51, 68, 0.35)';
                    sCtx.lineWidth = 1;
                } else {
                    l.active--;
                    sCtx.strokeStyle = '#ffffff';
                    sCtx.lineWidth = l.width;
                    sCtx.shadowColor = '#ff3344';
                    sCtx.shadowBlur = 10;
                }
                sCtx.stroke();
                sCtx.shadowBlur = 0;

                if (l.active <= 0) lines.splice(idx, 1);
            });

            // 플레이어 (흰색 피격점)
            sCtx.fillStyle = '#ffffff';
            sCtx.shadowColor = '#ffffff';
            sCtx.shadowBlur = 10;
            sCtx.beginPath();
            sCtx.arc(player.x, player.y, 5, 0, Math.PI * 2);
            sCtx.fill();
            sCtx.shadowBlur = 0;

            requestAnimationFrame(bossLoop);
        }

        slashBtn.onclick = () => {
            bossHp -= 34;
            isAttack = false;
            timer = 0;
            lines = [];
            slashBtn.style.display = 'none';

            if (bossHp <= 0) {
                alert("✨ 거미집의 아비들을 베어내고 [기적] 업적을 달성했습니다!");
                bossRunning = false;
                document.getElementById('boss-modal').style.display = 'none';
            } else {
                stage++;
                document.getElementById('boss-stage-text').innerText = `단계 ${stage} / 3`;
                document.getElementById('boss-msg').innerText = `${stage}페이즈 시작! 적의 공격이 빨라집니다.`;
                document.getElementById('boss-msg').style.color = "#ff3344";
            }
        };
    </script>
</body>
</html>
