<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roland RNG - Spider Boss Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: #050508; color: white;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 20px; position: relative;
        }

        /* ☰ 좌측 상단 햄버거 메뉴 버튼 */
        .menu-btn {
            position: absolute; top: 15px; left: 15px; z-index: 100;
            background: rgba(15, 15, 25, 0.85); border: 1px solid #444; color: #fff;
            font-size: 22px; width: 44px; height: 44px; border-radius: 12px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            backdrop-filter: blur(8px); transition: 0.2s;
        }
        .menu-btn:active { transform: scale(0.92); }

        /* 👈 슬라이드 사이드바 메뉴 */
        .sidebar {
            position: fixed; top: 0; left: -280px; width: 260px; height: 100vh;
            background: rgba(15, 15, 25, 0.95); border-right: 1px solid #333; z-index: 200;
            display: flex; flex-direction: column; padding: 60px 20px 20px; gap: 12px;
            backdrop-filter: blur(12px); transition: left 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            box-shadow: 10px 0 30px rgba(0,0,0,0.8);
        }
        .sidebar.open { left: 0; }

        .sidebar-title { font-size: 18px; font-weight: bold; color: #ff3344; margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .sidebar-item {
            background: rgba(30, 30, 45, 0.8); border: 1px solid #444; color: #eee;
            padding: 14px 18px; border-radius: 12px; font-size: 15px; font-weight: bold;
            cursor: pointer; text-align: left; transition: 0.2s; display: flex; align-items: center; gap: 10px;
        }
        .sidebar-item:active { background: #ff3344; color: #000; border-color: #ff3344; }

        .sidebar-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #333; padding-top: 15px; }

        .sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6); z-index: 150; backdrop-filter: blur(2px);
        }
        .sidebar-overlay.active { display: block; }

        /* 캔버스 및 캐릭터 메인 이펙트 */
        #aura-canvas-container {
            position: absolute; top: 38%; left: 50%;
            transform: translate(-50%, -50%);
            width: 500px; height: 500px;
            pointer-events: none; z-index: 2;
            display: flex; justify-content: center; align-items: center;
        }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        #character-avatar {
            width: 60px; height: 60px; background: #ffffff;
            border-radius: 50%; z-index: 5;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.9); transition: all 0.5s ease;
        }

        /* 상단 정보 바 */
        .top-bar {
            z-index: 10; display: flex; gap: 12px; background: rgba(15, 15, 25, 0.85);
            padding: 10px 20px; border-radius: 30px; border: 1px solid #333;
            backdrop-filter: blur(10px); flex-wrap: wrap; justify-content: center; max-width: 85%;
            margin-left: 40px;
        }
        .stat-item { font-size: 13px; font-weight: bold; }
        .stat-val { color: #00ffcc; }

        /* 메인 오라 타이틀 디스플레이 */
        .main-display {
            z-index: 10; text-align: center; display: flex; flex-direction: column;
            align-items: center; justify-content: center; margin-top: 250px;
        }
        .aura-title {
            font-size: 42px; font-weight: 900; letter-spacing: 2px;
            margin-bottom: 8px; text-shadow: 0 0 25px currentColor;
            transition: transform 0.15s ease; word-break: keep-all;
        }
        .aura-rarity {
            font-size: 18px; font-weight: 700; color: #aaa;
            background: rgba(0, 0, 0, 0.75); padding: 6px 20px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(5px);
        }

        /* 하단 컨트롤 영역 */
        .control-panel {
            z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 10px;
            margin-bottom: 15px; width: 100%; max-width: 480px;
        }
        .roll-btn {
            background: linear-gradient(135deg, #2b2b3d, #151522);
            color: #fff; border: 2px solid #00ffcc; padding: 18px 55px;
            font-size: 26px; font-weight: 900; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3); transition: all 0.1s; width: 100%;
        }
        .roll-btn:active { transform: scale(0.95); }
        .roll-btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: #555; box-shadow: none; }

        .btn-group { display: flex; gap: 10px; width: 100%; justify-content: center; }
        .sub-btn {
            background: rgba(25, 25, 40, 0.85); color: #ccc; border: 1px solid #444;
            padding: 10px 16px; border-radius: 20px; font-size: 13px; cursor: pointer;
            font-weight: bold; transition: 0.2s; flex: 1; text-align: center;
        }
        .sub-btn.active { background: #00ffcc; color: #000; border-color: #00ffcc; }

        #inspect-panel {
            display: none; z-index: 10; flex-direction: column; align-items: center; gap: 10px;
            margin-bottom: 25px; width: 100%; max-width: 480px;
        }
        .exit-btn {
            background: linear-gradient(135deg, #cc0000, #660000);
            color: #fff; border: 2px solid #ff4d4d; padding: 16px 50px;
            font-size: 22px; font-weight: 900; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.4); transition: all 0.1s; width: 100%;
        }
        .exit-btn:active { transform: scale(0.95); }

        /* 모달 시스템 공통 스타일 */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); z-index: 999; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #12121c; border: 1px solid #333; width: 90%; max-width: 520px;
            border-radius: 20px; padding: 25px; max-height: 80vh; overflow-y: auto;
        }
        .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; text-align: center; color: #00ffcc; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #222; font-size: 14px; }
        .view-btn {
            background: rgba(0, 255, 204, 0.15); color: #00ffcc; border: 1px solid #00ffcc;
            padding: 6px 12px; border-radius: 12px; font-size: 12px; cursor: pointer; font-weight: bold;
        }
        .craft-card { background: #1a1a28; border: 1px solid #333; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .craft-info { display: flex; flex-direction: column; gap: 4px; }
        .craft-req { font-size: 11px; color: #aaa; }

        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #222; }
        .setting-label { font-size: 14px; font-weight: bold; color: #ddd; }
        .setting-control input[type="range"] { width: 110px; accent-color: #00ffcc; }
        .setting-control input[type="checkbox"] { width: 20px; height: 20px; accent-color: #00ffcc; cursor: pointer; }

        @media (max-width: 768px) {
            body { padding: 12px; }
            #aura-canvas-container { width: 340px; height: 340px; top: 34%; }
            #character-avatar { width: 46px; height: 46px; }
            .top-bar { padding: 6px 12px; gap: 6px 10px; border-radius: 18px; font-size: 11px; margin-left: 30px; }
            .main-display { margin-top: 180px; }
            .aura-title { font-size: 28px; }
            .control-panel { gap: 8px; margin-bottom: 10px; }
            .roll-btn { padding: 15px 0; font-size: 22px; }
        }
    </style>
</head>
<body>

    <audio id="bgm-player" preload="auto"></audio>
    <audio id="boss-bgm-player" src="./boss_bgm.mp3" loop preload="auto"></audio>

    <button id="menu-toggle-btn" class="menu-btn">☰</button>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-title">메뉴 (Menu)</div>
        <button id="nav-inv" class="sidebar-item">📖 인벤토리 (도감)</button>
        <button id="nav-shop" class="sidebar-item">🛒 포션 상점</button>
        <button id="nav-craft" class="sidebar-item">🛠️ 재료 제작</button>

        <div class="sidebar-bottom">
            <button id="nav-fullscreen" class="sidebar-item">🖥️ 전체화면</button>
            <button id="nav-settings" class="sidebar-item">⚙️ 설정</button>
        </div>
    </div>

    <div id="aura-canvas-container">
        <canvas id="auraCanvas" width="500" height="500"></canvas>
        <div id="character-avatar"></div>
    </div>

    <div class="top-bar">
        <div class="stat-item">총 ROLL: <span id="total-rolls" class="stat-val">0</span>회</div>
        <div class="stat-item">골드: <span id="gold-val" class="stat-val" style="color:#ffd700;">0</span> G</div>
        <div class="stat-item">행운 배율: <span id="luck-mult" class="stat-val">1.0x</span></div>
        <div class="stat-item">최고 등급: <span id="best-roll" class="stat-val">None</span></div>
    </div>

    <div class="main-display">
        <div id="aura-name" class="aura-title" style="color: #888;">ROLL을 눌러주세요</div>
        <div id="aura-rarity" class="aura-rarity">1 / 1</div>
    </div>

    <div id="normal-panel" class="control-panel">
        <button id="roll-btn" class="roll-btn">ROLL (Space)</button>
        <div class="btn-group">
            <button id="auto-btn" class="sub-btn">Auto: OFF</button>
        </div>
    </div>

    <div id="inspect-panel">
        <button id="exit-inspect-btn" class="exit-btn">🚪 구경 종료 (돌아가기)</button>
    </div>

    <div id="inv-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">✨ 획득한 오라 도감 (30종)</div>
            <div id="inv-list"></div>
            <button id="close-inv" class="sub-btn" style="width:100%; margin-top:15px; padding: 12px 0;">닫기</button>
        </div>
    </div>

    <div id="shop-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">🛒 포션 상점 (골드 구매)</div>
            <div class="craft-card">
                <div class="craft-info">
                    <strong>소형 행운 포션 (+2x Luck / 15초)</strong>
                    <span class="craft-req">비용: 100 Gold</span>
                </div>
                <button class="sub-btn" onclick="buyPotion('small')">구매</button>
            </div>
            <button id="close-shop" class="sub-btn" style="width:100%; margin-top:15px; padding: 12px 0;">닫기</button>
        </div>
    </div>

    <div id="craft-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">🛠️ 재료 연금 제작소</div>
            <div class="craft-card">
                <div class="craft-info">
                    <strong>대형 행운 포션 (+5x Luck / 20초)</strong>
                    <span class="craft-req">재료: 500 Gold + Rare 1개</span>
                </div>
                <button class="sub-btn" onclick="craftPotion('large')">제작</button>
            </div>
            <button id="close-craft" class="sub-btn" style="width:100%; margin-top:15px; padding: 12px 0;">닫기</button>
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">⚙️ 게임 설정</div>
            <div class="setting-row">
                <span class="setting-label">BGM 배경음악</span>
                <div class="setting-control"><input type="range" id="bgm-volume" min="0" max="100" value="50"></div>
            </div>
            <button id="close-settings" class="sub-btn" style="width:100%; margin-top:20px; padding: 12px 0;">닫기</button>
        </div>
    </div>

    <script>
        const AURAS = [
            { name: "Common", chance: 2, color: "#a0a0a0", effect: "dust" },
            { name: "Uncommon", chance: 4, color: "#55ff55", effect: "leaf" },
            { name: "Good", chance: 8, color: "#55ffff", effect: "sparkle" },
            { name: "Natural", chance: 16, color: "#88ff88", effect: "floatCircle" },
            { name: "Rare", chance: 32, color: "#5555ff", effect: "orbitDots" },
            { name: "Divinus", chance: 64, color: "#ffff55", effect: "holyCross" },
            { name: "Rage", chance: 256, color: "#ff3333", effect: "fireFlame" },
            { name: "JACKPOT", chance: 7777, color: "#00ffaa", effect: "coinShower" },
            { name: "Roland: Absolute", chance: 100000000, color: "#ff0000", effect: "absoluteRedStorm" },
            { name: "CREATION", chance: 1000000000, color: "#00ffff", effect: "galaxyBigBang" }
        ];

        let totalRolls = 0, gold = 0, luck = 1.0, isAuto = false, isRolling = false;
        let bestChance = 0, bestName = "None";
        const inventory = {};

        const auraNameEl = document.getElementById('aura-name');
        const auraRarityEl = document.getElementById('aura-rarity');
        const totalRollsEl = document.getElementById('total-rolls');
        const goldValEl = document.getElementById('gold-val');
        const bestRollEl = document.getElementById('best-roll');
        const avatar = document.getElementById('character-avatar');

        function roll() {
            if (isRolling) return;
            isRolling = true;
            totalRolls++;
            totalRollsEl.innerText = totalRolls.toLocaleString();

            let selectedAura = AURAS[0];
            for (let i = AURAS.length - 1; i >= 0; i--) {
                if (Math.random() < (1 / (AURAS[i].chance / luck))) {
                    selectedAura = AURAS[i];
                    break;
                }
            }

            gold += Math.max(1, Math.floor(Math.log2(selectedAura.chance)));
            goldValEl.innerText = gold.toLocaleString();

            auraNameEl.innerText = selectedAura.name;
            auraNameEl.style.color = selectedAura.color;
            auraRarityEl.innerText = `1 / ${selectedAura.chance.toLocaleString()}`;
            avatar.style.backgroundColor = selectedAura.color;
            avatar.style.boxShadow = `0 0 35px ${selectedAura.color}`;

            inventory[selectedAura.name] = (inventory[selectedAura.name] || 0) + 1;

            if (selectedAura.chance > bestChance) {
                bestChance = selectedAura.chance;
                bestName = selectedAura.name;
                bestRollEl.innerText = `${bestName} (1/${bestChance.toLocaleString()})`;
                bestRollEl.style.color = selectedAura.color;
            }

            setTimeout(() => {
                isRolling = false;
                if (isAuto) roll();
            }, 200);
        }

        document.getElementById('roll-btn').addEventListener('click', roll);
        document.getElementById('auto-btn').addEventListener('click', () => {
            isAuto = !isAuto;
            document.getElementById('auto-btn').innerText = `Auto: ${isAuto ? 'ON' : 'OFF'}`;
            if (isAuto && !isRolling) roll();
        });

        /* ==========================================================================
           [Boss Encounter] 거미집 style 언더테일 닷지 보스전 기믹
           ========================================================================== */

        const bossStyles = `
            #boss-modal {
                display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
                background: #000; z-index: 10000; flex-direction: column;
                justify-content: center; align-items: center; overflow: hidden;
            }
            .boss-ui-top {
                position: absolute; top: 20px; width: 90%; max-width: 400px;
                display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 10001;
            }
            .boss-title { font-size: 20px; font-weight: 900; color: #ff3344; letter-spacing: 2px; }
            .boss-hp-bar {
                width: 100%; height: 12px; background: rgba(255,255,255,0.1);
                border: 1px solid #ff3344; border-radius: 6px; overflow: hidden;
            }
            .boss-hp-fill { width: 100%; height: 100%; background: #ff3344; transition: width 0.1s linear; }
            .boss-stage-text { font-size: 13px; color: #aaa; font-weight: bold; }
            #spider-box {
                position: relative; width: 320px; height: 320px;
                border: 2px solid #ff3344; background: #080305;
                box-shadow: 0 0 25px rgba(255, 51, 68, 0.3); overflow: hidden;
            }
            #spiderCanvas { width: 100%; height: 100%; cursor: crosshair; }
            .boss-msg-box {
                margin-top: 12px; color: #fff; font-size: 13px; height: 20px; font-weight: bold; text-align: center;
            }
            .attack-action-btn {
                display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                background: #ff3344; color: #fff; border: none; padding: 12px 30px; font-size: 18px;
                font-weight: 900; border-radius: 25px; cursor: pointer; box-shadow: 0 0 20px #ff3344;
                z-index: 10002;
            }
            .boss-exit-btn {
                position: absolute; bottom: 20px; background: rgba(255,255,255,0.1);
                color: #888; border: 1px solid #444; padding: 8px 20px; border-radius: 20px;
                font-size: 13px; cursor: pointer;
            }
        `;
        const styleSheet = document.createElement("style");
        styleSheet.innerText = bossStyles;
        document.head.appendChild(styleSheet);

        const bossModalHtml = `
            <div id="boss-modal">
                <div class="boss-ui-top">
                    <div class="boss-title">🕸️ 거미집의 검 (Spider's Web)</div>
                    <div class="boss-hp-bar"><div id="boss-hp-fill" class="boss-hp-fill"></div></div>
                    <div id="boss-stage-text" class="boss-stage-text">단계 1 / 3</div>
                </div>
                <div id="spider-box">
                    <canvas id="spiderCanvas" width="320" height="320"></canvas>
                    <button id="boss-slash-btn" class="attack-action-btn">🗡️ 베기!</button>
                </div>
                <div id="boss-msg" class="boss-msg-box">공격을 피하세요!</div>
                <button id="close-boss-btn" class="boss-exit-btn">도망치기</button>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', bossModalHtml);

        const sidebar = document.getElementById('sidebar');
        if (sidebar) {
            const bossNavBtn = document.createElement('button');
            bossNavBtn.className = 'sidebar-item';
            bossNavBtn.style.color = '#ff3344';
            bossNavBtn.style.borderColor = '#ff3344';
            bossNavBtn.innerHTML = '⚔️ 거미집 보스전';
            bossNavBtn.onclick = () => {
                sidebar.classList.remove('open');
                document.getElementById('sidebar-overlay').classList.remove('active');
                startSpiderBoss();
            };
            sidebar.insertBefore(bossNavBtn, sidebar.querySelector('.sidebar-bottom'));
        }

        class SpiderBossGame {
            constructor() {
                this.canvas = document.getElementById('spiderCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.modal = document.getElementById('boss-modal');
                this.hpFill = document.getElementById('boss-hp-fill');
                this.stageText = document.getElementById('boss-stage-text');
                this.msgEl = document.getElementById('boss-msg');
                this.slashBtn = document.getElementById('boss-slash-btn');

                this.isRunning = false;
                this.animId = null;

                this.stage = 1;
                this.bossHp = 100;
                this.player = { x: 160, y: 160, radius: 5 };
                this.lines = [];
                this.timer = 0;
                this.phaseTimer = 0;
                this.isAttackOpportunity = false;

                this.initControls();
            }

            initControls() {
                const movePlayer = (e) => {
                    if (!this.isRunning) return;
                    const rect = this.canvas.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                    this.player.x = Math.max(8, Math.min(312, clientX - rect.left));
                    this.player.y = Math.max(8, Math.min(312, clientY - rect.top));
                };

                this.canvas.addEventListener('mousemove', movePlayer);
                this.canvas.addEventListener('touchmove', (e) => {
                    movePlayer(e);
                    e.preventDefault();
                }, { passive: false });

                this.slashBtn.addEventListener('click', () => this.executeSlash());
            }

            start() {
                this.isRunning = true;
                this.stage = 1;
                this.bossHp = 100;
                this.player = { x: 160, y: 160, radius: 5 };
                this.lines = [];
                this.timer = 0;
                this.phaseTimer = 0;
                this.isAttackOpportunity = false;

                this.modal.style.display = 'flex';
                this.slashBtn.style.display = 'none';

                const bossBgm = document.getElementById('boss-bgm-player');
                const mainBgm = document.getElementById('bgm-player');
                if (mainBgm) mainBgm.pause();
                if (bossBgm) { bossBgm.currentTime = 0; bossBgm.play().catch(() => {}); }

                this.updateUI();
                this.loop();
            }

            stop() {
                this.isRunning = false;
                cancelAnimationFrame(this.animId);
                this.modal.style.display = 'none';

                const bossBgm = document.getElementById('boss-bgm-player');
                const mainBgm = document.getElementById('bgm-player');
                if (bossBgm) bossBgm.pause();
                if (mainBgm) mainBgm.play().catch(() => {});
            }

            spawnLines() {
                if (this.stage === 1) {
                    // 1페이즈: 세 갈래 참격
                    if (this.timer % 30 === 0) {
                        const angle = Math.random() * Math.PI;
                        this.lines.push({
                            x1: 160 + Math.cos(angle) * 200, y1: 160 + Math.sin(angle) * 200,
                            x2: 160 - Math.cos(angle) * 200, y2: 160 - Math.sin(angle) * 200,
                            warn: 25, active: 10, width: 3
                        });
                    }
                } else if (this.stage === 2) {
                    // 2페이즈: 거미줄 십자 및 사선 참격
                    if (this.timer % 20 === 0) {
                        const isHorizontal = Math.random() < 0.5;
                        this.lines.push({
                            x1: isHorizontal ? 0 : Math.random() * 320,
                            y1: isHorizontal ? Math.random() * 320 : 0,
                            x2: isHorizontal ? 320 : Math.random() * 320,
                            y2: isHorizontal ? Math.random() * 320 : 320,
                            warn: 20, active: 8, width: 4
                        });
                    }
                } else if (this.stage === 3) {
                    // 3페이즈: 난사 참격
                    if (this.timer % 12 === 0) {
                        this.lines.push({
                            x1: Math.random() * 320, y1: 0,
                            x2: Math.random() * 320, y2: 320,
                            warn: 15, active: 6, width: 5
                        });
                    }
                }
            }

            update() {
                this.timer++;
                this.phaseTimer++;

                // 틈이 열리는 타이밍 (공격 기회)
                if (this.phaseTimer > 250 && !this.isAttackOpportunity) {
                    this.isAttackOpportunity = true;
                    this.slashBtn.style.display = 'block';
                    this.msgEl.innerText = "틈이 열렸다! 지금 베어라!";
                    this.msgEl.style.color = "#00ffcc";
                }

                if (!this.isAttackOpportunity) {
                    this.spawnLines();
                }

                // 참격 업데이트 및 충돌 판정
                for (let i = this.lines.length - 1; i >= 0; i--) {
                    const l = this.lines[i];
                    if (l.warn > 0) {
                        l.warn--;
                    } else {
                        // 참격 발동 상태에서 캐릭터에 닿았는지 판정
                        if (this.checkLineCollision(l)) {
                            alert("💀 참격에 베였습니다! 피격 없이 베어야 승리합니다.");
                            this.stop();
                            return;
                        }
                        l.active--;
                        if (l.active <= 0) this.lines.splice(i, 1);
                    }
                }
            }

            checkLineCollision(l) {
                const A = this.player.x - l.x1;
                const B = this.player.y - l.y1;
                const C = l.x2 - l.x1;
                const D = l.y2 - l.y1;

                const dot = A * C + B * D;
                const len_sq = C * C + D * D;
                let param = -1;
                if (len_sq !== 0) param = dot / len_sq;

                let xx, yy;
                if (param < 0) { xx = l.x1; yy = l.y1; }
                else if (param > 1) { xx = l.x2; yy = l.y2; }
                else { xx = l.x1 + param * C; yy = l.y1 + param * D; }

                const dx = this.player.x - xx;
                const dy = this.player.y - yy;
                return Math.sqrt(dx * dx + dy * dy) < (this.player.radius + l.width / 2);
            }

            executeSlash() {
                this.isAttackOpportunity = false;
                this.slashBtn.style.display = 'none';
                this.lines = [];
                this.phaseTimer = 0;

                this.bossHp -= 34;
                if (this.bossHp <= 0) {
                    alert("✨ 거미집의 아비들을 노히트로 베어내고 [기적] 업적을 달성했습니다!");
                    this.stop();
                    return;
                }

                this.stage++;
                this.msgEl.innerText = `${this.stage}페이즈 시작! 적의 공격이 거세집니다.`;
                this.msgEl.style.color = "#ff3344";
                this.updateUI();
            }

            updateUI() {
                this.hpFill.style.width = `${Math.max(0, this.bossHp)}%`;
                this.stageText.innerText = `단계 ${this.stage} / 3`;
            }

            render() {
                this.ctx.clearRect(0, 0, 320, 320);

                // 배경 거미줄 연출
                this.ctx.strokeStyle = 'rgba(255, 51, 68, 0.15)';
                this.ctx.lineWidth = 1;
                for (let i = 0; i < 4; i++) {
                    this.ctx.beginPath();
                    this.ctx.arc(160, 160, (i + 1) * 35, 0, Math.PI * 2);
                    this.ctx.stroke();
                }

                // 참격 (경고선 및 실제 참격)
                this.lines.forEach(l => {
                    this.ctx.beginPath();
                    this.ctx.moveTo(l.x1, l.y1);
                    this.ctx.lineTo(l.x2, l.y2);

                    if (l.warn > 0) {
                        this.ctx.strokeStyle = 'rgba(255, 51, 68, 0.3)';
                        this.ctx.lineWidth = 1;
                    } else {
                        this.ctx.strokeStyle = '#ffffff';
                        this.ctx.lineWidth = l.width;
                        this.ctx.shadowColor = '#ff3344';
                        this.ctx.shadowBlur = 10;
                    }
                    this.ctx.stroke();
                    this.ctx.shadowBlur = 0;
                });

                // 플레이어 (흰색 피격점)
                this.ctx.fillStyle = '#ffffff';
                this.ctx.shadowColor = '#ffffff';
                this.ctx.shadowBlur = 8;
                this.ctx.beginPath();
                this.ctx.arc(this.player.x, this.player.y, this.player.radius, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.shadowBlur = 0;
            }

            loop() {
                if (!this.isRunning) return;
                this.update();
                this.render();
                this.animId = requestAnimationFrame(() => this.loop());
            }
        }

        const spiderBoss = new SpiderBossGame();
        function startSpiderBoss() { spiderBoss.start(); }
        document.getElementById('close-boss-btn').addEventListener('click', () => spiderBoss.stop());
    </script>
</body>
