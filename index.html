<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sol's RNG</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background-color: #000000; color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            min-height: 100vh; overflow: hidden; padding: 15px; position: relative;
        }

        /* 상단 네비게이션 버튼 */
        #top-bar {
            width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }
        .menu-btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
        .menu-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; backdrop-filter: blur(5px);
        }

        /* 메인 비주얼 영역 (중앙 정렬 완벽 보정) */
        #display-container {
            position: relative; width: 320px; height: 320px;
            display: flex; justify-content: center; align-items: center;
            margin: auto 0;
        }
        #auraCanvas {
            position: absolute; width: 320px; height: 320px; top: 0; left: 0; z-index: 1; pointer-events: none;
        }
        #character-avatar {
            position: relative; width: 80px; height: 80px; border-radius: 50%;
            background: #a0a0a0; z-index: 2; box-shadow: 0 0 35px #a0a0a0;
            background-size: cover; background-position: center; transition: background 0.3s;
        }

        /* 하단 정보 표시판 */
        #info-panel {
            width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 10; margin-bottom: 10px;
        }
        #aura-name { font-size: 28px; font-weight: 800; text-shadow: 0 0 15px currentColor; text-align: center; }
        #aura-rarity { font-size: 16px; color: #aaa; margin-bottom: 10px; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; font-size: 13px; color: #ccc; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; }
        .stat-item { display: flex; justify-content: space-between; }

        /* 하단 조작 버튼 그룹 */
        #action-bar { width: 100%; max-width: 480px; display: flex; gap: 10px; z-index: 10; }
        .action-btn {
            flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: #fff;
        }
        #roll-btn { background: linear-gradient(135deg, #0088ff, #0044ff); }
        #auto-btn { background: #333; }
        #auto-btn.active { background: #00ffcc; color: #000; }

        /* 사이드바 & 모달 기본 스타일 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #181818; border: 1px solid #333; width: 90%; max-width: 420px; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; max-height: 80vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .close-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 상단 메뉴 -->
    <div id="top-bar">
        <div class="menu-btn-group">
            <button class="menu-btn" onclick="openModal('inv-modal')">🎒 인벤토리</button>
            <button class="menu-btn" onclick="openModal('gear-modal')">🛡️ 장비 보관함</button>
            <button class="menu-btn" onclick="openModal('shop-modal')">🛒 상점</button>
            <button class="menu-btn" onclick="openModal('craft-modal')">⚒️ 조합소</button>
        </div>
        <button class="menu-btn" onclick="toggleFullscreen()">📺 전체화면</button>
    </div>

    <!-- 중앙 캔버스 및 캐릭터 영역 -->
    <div id="display-container">
        <canvas id="auraCanvas" width="500" height="500"></canvas>
        <div id="character-avatar"></div>
    </div>

    <!-- 하단 정보 표시 영역 -->
    <div id="info-panel">
        <div id="aura-name">Common</div>
        <div id="aura-rarity">1 / 2</div>

        <div class="stat-grid">
            <div class="stat-item"><span>총 ROLL:</span> <strong id="total-rolls">0</strong></div>
            <div class="stat-item"><span>골드:</span> <strong id="gold-val">0 G</strong></div>
            <div class="stat-item"><span>행운:</span> <strong id="luck-mult" style="color:#00ffcc;">1.0x</strong></div>
            <div class="stat-item"><span>장착 장비:</span> <strong id="equipped-gear">없음</strong></div>
        </div>
    </div>

    <!-- 버튼 영역 -->
    <div id="action-bar">
        <button id="roll-btn" class="action-btn">ROLL</button>
        <button id="auto-btn" class="action-btn">Auto: OFF</button>
    </div>

    <!-- 모달: 인벤토리 -->
    <div id="inv-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🎒 인벤토리</h3>
                <button class="close-btn" onclick="closeModal('inv-modal')">✕</button>
            </div>
            <div id="inv-list"></div>
        </div>
    </div>

    <!-- 모달: 장비 보관함 -->
    <div id="gear-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🛡️ 장비 보관함</h3>
                <button class="close-btn" onclick="closeModal('gear-modal')">✕</button>
            </div>
            <div id="gear-list"></div>
        </div>
    </div>

    <!-- 오디오 재생용 element -->
    <audio id="bgm-player" loop></audio>

    <!-- 스크립트 연결 -->
    <script src="game.js"></script>
</body>
</html>
