<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roland RNG - Main Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: #050508; color: white; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px; }
        .menu-btn { position: absolute; top: 15px; left: 15px; z-index: 100; background: #222; border: 1px solid #444; color: #fff; font-size: 22px; width: 44px; height: 44px; border-radius: 12px; cursor: pointer; }
        .sidebar { position: fixed; top: 0; left: -280px; width: 260px; height: 100vh; background: #111; z-index: 200; display: flex; flex-direction: column; padding: 60px 20px 20px; gap: 12px; transition: 0.3s; }
        .sidebar.open { left: 0; }
        .sidebar-item { background: #222; border: 1px solid #444; color: #eee; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: left; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 150; }
        .sidebar-overlay.active { display: block; }
        
        .main-display { text-align: center; margin-top: 200px; }
        .aura-title { font-size: 38px; font-weight: 900; }
        .roll-btn { background: #00ffcc; color: #000; border: none; padding: 16px 50px; font-size: 24px; font-weight: 900; border-radius: 30px; cursor: pointer; margin-bottom: 30px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 999; justify-content: center; align-items: center; }
        .modal-content { background: #181824; width: 90%; max-width: 400px; padding: 20px; border-radius: 16px; color: #fff; }

        #spider-box { position: relative; width: 320px; height: 320px; border: 2px solid #ff3344; background: #000; }
        .attack-btn { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #ff3344; color: #fff; border: none; padding: 10px 20px; font-weight: bold; border-radius: 20px; cursor: pointer; z-index: 10; }
    </style>
</head>
<body>

    <button id="menu-toggle-btn" class="menu-btn">☰</button>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div id="sidebar" class="sidebar">
        <div style="font-size:18px; font-weight:bold; color:#00ffcc; margin-bottom:10px;">메뉴</div>
        <button id="nav-inv" class="sidebar-item">📖 오라 도감</button>
        <button id="nav-boss" class="sidebar-item" style="color:#ff3344;">⚔️ 거미집 보스전</button>
    </div>

    <div class="main-display">
        <div id="aura-name" class="aura-title" style="color:#888;">ROLL을 눌러주세요</div>
        <div id="aura-rarity" style="margin-top:10px; color:#aaa;">1 / 1</div>
    </div>

    <button id="roll-btn" class="roll-btn">ROLL</button>

    <!-- 도감 모달 -->
    <div id="inv-modal" class="modal">
        <div class="modal-content">
            <h3>📖 획득한 오라</h3>
            <div id="inv-list" style="margin:15px 0; max-height:200px; overflow-y:auto;"></div>
            <button class="close-modal-btn" style="width:100%; padding:8px;">닫기</button>
        </div>
    </div>

    <!-- 거미집 보스 모달 -->
    <div id="boss-modal" class="modal">
        <div class="modal-content" style="text-align:center;">
            <h3 style="color:#ff3344;">🕸️ 거미집 아비들</h3>
            <div id="boss-stage-text" style="font-size:12px; margin:5px 0;">단계 1 / 3</div>
            <div id="spider-box" style="margin:0 auto;">
                <canvas id="spiderCanvas" width="320" height="320"></canvas>
                <button id="boss-slash-btn" class="attack-btn">🗡️ 베기!</button>
            </div>
            <div id="boss-msg" style="margin-top:10px; font-size:12px;">공격을 피하세요!</div>
            <button id="close-boss-btn" style="margin-top:10px; padding:6px 16px;">도망치기</button>
        </div>
    </div>

    <!-- 모듈 스크립트 연결 및 통합 구동 -->
    <script type="module">
        import { AuraManager, AURAS } from './aura.js';
        import { MenuSystem } from './menu.js';
        import { SpiderBossEngine } from './boss.js';

        // 1. 인스턴스 생성
        const auraApp = new AuraManager();
        const bossApp = new SpiderBossEngine('spiderCanvas');

        // 2. 메뉴 시스템 구동 및 콜백 연결
        const menuApp = new MenuSystem({
            onOpenInv: () => {
                const listEl = document.getElementById('inv-list');
                listEl.innerHTML = '';
                AURAS.forEach(a => {
                    const count = auraApp.inventory[a.name] || 0;
                    listEl.innerHTML += `<div style="display:flex; justify-between; padding:4px 0;">
                        <span style="color:${a.color}">${a.name}</span>
                        <span>${count}개</span>
                    </div>`;
                });
            },
            onStartBoss: () => {
                bossApp.start();
            }
        });

        // 3. 메인 ROLL 버튼 연동
        document.getElementById('roll-btn').addEventListener('click', () => {
            const aura = auraApp.roll();
            if (aura) {
                const nameEl = document.getElementById('aura-name');
                const rarityEl = document.getElementById('aura-rarity');
                nameEl.innerText = aura.name;
                nameEl.style.color = aura.color;
                rarityEl.innerText = `1 / ${aura.chance.toLocaleString()}`;
            }
        });

        document.getElementById('close-boss-btn').addEventListener('click', () => {
            bossApp.stop();
        });
    </script>
</body>
</html>
