<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roland RNG - Premium Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: #020205; color: white;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 20px; position: relative;
        }

        /* ☰ 메뉴 버튼 */
        .menu-btn {
            position: absolute; top: 15px; left: 15px; z-index: 100;
            background: rgba(15, 15, 25, 0.85); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff;
            font-size: 22px; width: 44px; height: 44px; border-radius: 12px;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            backdrop-filter: blur(12px); box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: all 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .menu-btn:active { transform: scale(0.92); }

        /* 👈 사이드바 메뉴 */
        .sidebar {
            position: fixed; top: 0; left: -290px; width: 270px; height: 100vh;
            background: rgba(10, 10, 18, 0.95); border-right: 1px solid rgba(255, 255, 255, 0.1); z-index: 200;
            display: flex; flex-direction: column; padding: 60px 20px 20px; gap: 12px;
            backdrop-filter: blur(20px); transition: left 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
            box-shadow: 15px 0 35px rgba(0,0,0,0.8);
        }
        .sidebar.open { left: 0; }

        .sidebar-title { font-size: 18px; font-weight: 800; color: #ff3344; margin-bottom: 5px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 12px; letter-spacing: 1px; }
        .sidebar-item {
            background: rgba(25, 25, 40, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); color: #eee;
            padding: 14px 18px; border-radius: 12px; font-size: 14px; font-weight: 700;
            cursor: pointer; text-align: left; transition: all 0.2s; display: flex; align-items: center; gap: 10px;
        }
        .sidebar-item:active { background: #ff3344; color: #fff; border-color: #ff3344; }

        .sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); z-index: 150; backdrop-filter: blur(4px);
        }
        .sidebar-overlay.active { display: block; }

        /* 배경 네온 앰비언트 광원 */
        #ambient-glow {
            position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%);
            width: 350px; height: 350px; border-radius: 50%;
            background: radial-gradient(circle, rgba(136, 136, 136, 0.2) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none; z-index: 1; transition: background 0.8s ease;
        }

        /* 캔버스 및 아우라 연출 */
        #aura-canvas-container {
            position: absolute; top: 38%; left: 50%;
            transform: translate(-50%, -50%);
            width: 500px; height: 500px;
            pointer-events: none; z-index: 2;
            display: flex; justify-content: center; align-items: center;
        }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        #character-avatar {
            width: 64px; height: 64px; background: #ffffff;
            border-radius: 50%; z-index: 5;
            box-shadow: 0 0 45px rgba(255, 255, 255, 0.9); transition: all 0.5s ease;
        }

        /* 타이틀 디스플레이 */
        .main-display {
            z-index: 10; text-align: center; display: flex; flex-direction: column;
            align-items: center; justify-content: center; margin-top: 240px;
        }
        .aura-title {
            font-size: 42px; font-weight: 900; letter-spacing: 2px;
            margin-bottom: 8px; text-shadow: 0 0 30px currentColor;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            word-break: keep-all;
        }
        .aura-rarity {
            font-size: 16px; font-weight: 800; color: #ddd;
            background: rgba(0, 0, 0, 0.75); padding: 6px 22px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
