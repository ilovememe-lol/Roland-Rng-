<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>크아악 RNG - 하이퀄리티 이펙트</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; user-select: none; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: #050508; color: white;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 20px; position: relative;
        }

        /* 캔버스 아우라 이펙트 (중앙 배치) */
        #aura-canvas-container {
            position: absolute; top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            width: 500px; height: 500px;
            pointer-events: none; z-index: 2;
            display: flex; justify-content: center; align-items: center;
        }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        #character-avatar {
            width: 60px; height: 60px; background: #ffffff;
            border-radius: 50%; z-index: 5;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.9); transition: all 0.5s ease;
        }

        /* 상단 스탯 */
        .top-bar {
            z-index: 10; display: flex; gap: 15px; background: rgba(15, 15, 25, 0.85);
            padding: 12px 24px; border-radius: 30px; border: 1px solid #333;
            backdrop-filter: blur(10px); flex-wrap: wrap; justify-content: center;
        }
        .stat-item { font-size: 14px; font-weight: bold; }
        .stat-val { color: #00ffcc; }

        /* 중앙 결과창 */
        .main-display {
            z-index: 10; text-align: center; display: flex; flex-direction: column;
            align-items: center; justify-content: center; margin-top: 260px;
        }
        .aura-title {
            font-size: 44px; font-weight: 900; letter-spacing: 2px;
            margin-bottom: 8px; text-shadow: 0 0 25px currentColor;
            transition: transform 0.15s ease;
        }
        .aura-rarity {
            font-size: 18px; font-weight: 700; color: #aaa;
            background: rgba(0, 0, 0, 0.75); padding: 6px 20px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(5px);
        }

        /* 하단 제어 */
        .control-panel {
            z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 12px;
            margin-bottom: 15px;
        }
        .roll-btn {
            background: linear-gradient(135deg, #2b2b3d, #151522);
            color: #fff; border: 2px solid #00ffcc; padding: 18px 55px;
            font-size: 26px; font-weight: 900; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3); transition: all 0.1s;
        }
        .roll-btn:active { transform: scale(0.95); }
        .roll-btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: #555; box-shadow: none; }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .sub-btn {
            background: rgba(25, 25, 40, 0.85); color: #ccc; border: 1px solid #444;
            padding: 9px 18px; border-radius: 20px; font-size: 13px; cursor: pointer;
            font-weight: bold; transition: 0.2s;
        }
        .sub-btn.active { background: #00ffcc; color: #000; border-color: #00ffcc; }

        /* 모달 */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); z-index: 999; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #12121c; border: 1px solid #333; width: 85%; max-width: 520px;
            border-radius: 20px; padding: 25px; max-height: 75vh; overflow-y: auto;
        }
        .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; text-align: center; color: #00ffcc; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #222; font-size: 14px; }
        .craft-card { background: #1a1a28; border: 1px solid #333; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .craft-info { display: flex; flex-direction: column; gap: 4px; }
        .craft-req { font-size: 11px; color: #aaa; }
    </style>
</head>
<body>

    <div id="aura-canvas-container">
        <canvas id="auraCanvas" width="500" height="500"></canvas>
        <div id="character-avatar"></div>
    </div>

    <!-- 스탯 -->
    <div class="top-bar">
        <div class="stat-item">총 ROLL: <span id="total-rolls" class="stat-val">0</span>회</div>
        <div class="stat-item">골드: <span id="gold-val" class="stat-val" style="color:#ffd700;">0</span> G</div>
        <div class="stat-item">행운 배율: <span id="luck-mult" class="stat-val">1.0x</span></div>
        <div class="stat-item">최고 등급: <span id="best-roll" class="stat-val">None</span></div>
    </div>

    <!-- 결과창 -->
    <div class="main-display">
        <div id="aura-name" class="aura-title" style="color: #888;">ROLL을 눌러주세요</div>
        <div id="aura-rarity" class="aura-rarity">1 / 1</div>
    </div>

    <!-- 하단 버튼 -->
    <div class="control-panel">
        <button id="roll-btn" class="roll-btn">ROLL (Space)</button>
        <div class="btn-group">
            <button id="auto-btn" class="sub-btn">Auto Roll: OFF</button>
            <button id="shop-btn" class="sub-btn">🧪 포션 상점 / 제작</button>
            <button id="inv-btn" class="sub-btn">📖 도감</button>
        </div>
    </div>

    <!-- 모달들 -->
    <div id="inv-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">✨ 획득한 오라 도감 (30종)</div>
            <div id="inv-list"></div>
            <button id="close-inv" class="sub-btn" style="width:100%; margin-top:15px;">닫기</button>
        </div>
    </div>

    <div id="shop-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">🧪 포션 연금술 상점</div>
            <div class="craft-card">
                <div class="craft-info">
                    <strong>소형 행운 포션 (+2x Luck / 15초)</strong>
                    <span class="craft-req">비용: 100 Gold</span>
                </div>
                <button class="sub-btn" onclick="buyPotion('small')">구매</button>
            </div>
            <div class="craft-card">
                <div class="craft-info">
                    <strong>대형 행운 포션 (+5x Luck / 20초)</strong>
                    <span class="craft-req">재료: 500 Gold + Rare 1개</span>
                </div>
                <button class="sub-btn" onclick="craftPotion('large')">제작</button>
            </div>
            <div class="craft-card">
                <div class="craft-info">
                    <strong>초스피드 포션 (Auto 속도 3배 / 20초)</strong>
                    <span class="craft-req">재료: 1,000 Gold + Glacier 1개</span>
                </div>
                <button class="sub-btn" onclick="craftPotion('speed')">제작</button>
            </div>
            <div class="craft-card">
                <div class="craft-info">
                    <strong>초월의 연금 포션 (+20x Luck / 10초)</strong>
                    <span class="craft-req">재료: 5,000 Gold + Diaboli 1개</span>
                </div>
                <button class="sub-btn" onclick="craftPotion('hyper')">제작</button>
            </div>
            <button id="close-shop" class="sub-btn" style="width:100%; margin-top:15px;">닫기</button>
        </div>
    </div>

    <script>
        // 개별 고유 고퀄리티 이펙트 타입 정의 (30종)
        const AURAS = [
            { name: "Common", chance: 2, color: "#a0a0a0", effect: "dust" },
            { name: "Uncommon", chance: 4, color: "#55ff55", effect: "leaf" },
            { name: "Good", chance: 8, color: "#55ffff", effect: "sparkle" },
            { name: "Natural", chance: 16, color: "#88ff88", effect: "floatCircle" },
            { name: "Rare", chance: 32, color: "#5555ff", effect: "orbitDots" },
            { name: "Divinus", chance: 64, color: "#ffff55", effect: "holyCross" },
            { name: "Crystallized", chance: 128, color: "#00ffff", effect: "crystalShard" },
            { name: "Rage", chance: 256, color: "#ff3333", effect: "fireFlame" },
            { name: "Topaz", chance: 500, color: "#ffaa00", effect: "goldenBeam" },
            { name: "Glacier", chance: 1024, color: "#aaffff", effect: "snowBurst" },
            { name: "Wind", chance: 2500, color: "#88ffff", effect: "swirlVortex" },
            { name: "Gilded", chance: 5000, color: "#ffd700", effect: "goldRune" },
            { name: "JACKPOT", chance: 7777, color: "#00ffaa", effect: "coinShower" },
            { name: "Diaboli", chance: 10000, color: "#990000", effect: "demonHellfire" },
            { name: "Undefined", chance: 20000, color: "#e0e0e0", effect: "pixelNoise" },
            { name: "PERMAFROST", chance: 35000, color: "#00bfff", effect: "iceAura" },
            { name: "FLARE", chance: 50000, color: "#ff4500", style: "sunExplosions", effect: "sunExplosion" },
            { name: "STarlight", chance: 80000, color: "#ffffaa", effect: "starMeteor" },
            { name: "BOUNDLESS", chance: 120000, color: "#da70d6", effect: "voidNebula" },
            { name: "GLITCH", chance: 250000, color: "#00ff66", effect: "cyberGlitch" },
            { name: "CELESTIAL", chance: 500000, color: "#00bfff", effect: "cosmicRings" },
            { name: "OVERDRIVE", chance: 850000, color: "#ff00aa", effect: "lightningSpark" },
            { name: "KRAAK ROLAND", chance: 1500000, color: "#ff0055", effect: "darkBloodPillar" },
            { name: "AURA OF RUIN", chance: 3000000, color: "#8b0000", effect: "blackHole" },
            { name: "SOLARIS", chance: 7500000, color: "#ff8c00", effect: "solarCrown" },
            { name: "CHROMATIC", chance: 15000000, color: "#ff00ff", effect: "rainbowPrism" },
            { name: "ECLIPSE", chance: 40000000, color: "#4b0082", effect: "shadowEclipse" },
            { name: "Roland: Absolute", chance: 100000000, color: "#ff0000", effect: "absoluteRedStorm" },
            { name: "THE ONE", chance: 300000000, color: "#ffffff", effect: "whiteGodLight" },
            { name: "CREATION", chance: 1000000000, color: "#00ffff", effect: "galaxyBigBang" }
        ];

        let totalRolls = 0, gold = 0, luck = 1.0, autoDelay = 250;
        let bestChance = 0, bestName = "None", isAuto = false, isRolling = false;
        let activeBuff = null;
        const inventory = {};

        // Canvas 2D 엔진
        const canvas = document.getElementById('auraCanvas');
        const ctx = canvas.getContext('2d');
        const particles = [];
        let currentAura = AURAS[0];

        // DOM
        const rollBtn = document.getElementById('roll-btn');
        const autoBtn = document.getElementById('auto-btn');
        const shopBtn = document.getElementById('shop-btn');
        const invBtn = document.getElementById('inv-btn');
        const invModal = document.getElementById('inv-modal');
        const shopModal = document.getElementById('shop-modal');
        const closeInv = document.getElementById('close-inv');
        const closeShop = document.getElementById('close-shop');

        const auraNameEl = document.getElementById('aura-name');
        const auraRarityEl = document.getElementById('aura-rarity');
        const totalRollsEl = document.getElementById('total-rolls');
        const goldValEl = document.getElementById('gold-val');
        const luckMultEl = document.getElementById('luck-mult');
        const bestRollEl = document.getElementById('best-roll');
        const avatar = document.getElementById('character-avatar');

        function roll() {
            if (isRolling) return;
            isRolling = true;
            rollBtn.disabled = true;

            totalRolls++;
            totalRollsEl.innerText = totalRolls.toLocaleString();

            let rollCount = 0;
            const rollInterval = setInterval(() => {
                const tempAura = AURAS[Math.floor(Math.random() * 6)];
                auraNameEl.innerText = tempAura.name;
                auraNameEl.style.color = tempAura.color;
                auraRarityEl.innerText = `1 / ${tempAura.chance.toLocaleString()}`;
                rollCount++;

                if (rollCount > 7) {
                    clearInterval(rollInterval);
                    finalizeRoll();
                }
            }, 45);
        }

        function finalizeRoll() {
            let selectedAura = AURAS[0];
            for (let i = AURAS.length - 1; i >= 0; i--) {
                const effectiveChance = AURAS[i].chance / luck;
                if (Math.random() < (1 / effectiveChance)) {
                    selectedAura = AURAS[i];
                    break;
                }
            }

            const earnedGold = Math.max(1, Math.floor(Math.log2(selectedAura.chance)));
            gold += earnedGold;
            goldValEl.innerText = gold.toLocaleString();

            auraNameEl.innerText = selectedAura.name;
            auraNameEl.style.color = selectedAura.color;
            auraNameEl.style.transform = "scale(1.2)";
            setTimeout(() => auraNameEl.style.transform = "scale(1)", 150);
            auraRarityEl.innerText = `1 / ${selectedAura.chance.toLocaleString()}`;

            currentAura = selectedAura;
            avatar.style.backgroundColor = selectedAura.color;
            avatar.style.boxShadow = `0 0 35px ${selectedAura.color}`;

            inventory[selectedAura.name] = (inventory[selectedAura.name] || 0) + 1;

            if (selectedAura.chance > bestChance) {
                bestChance = selectedAura.chance;
                bestName = selectedAura.name;
                bestRollEl.innerText = `${bestName} (1/${bestChance.toLocaleString()})`;
                bestRollEl.style.color = selectedAura.color;
            }

            setTimeout(() => {
                isRolling = false;
                rollBtn.disabled = false;
                if (isAuto) setTimeout(roll, autoDelay);
            }, 250);
        }

        // ================= Canvas 이펙트 랜더러 =================
        let angleTick = 0;

        function renderCanvas() {
            ctx.clearRect(0, 0, 500, 500);
            const centerX = 250, centerY = 250;
            angleTick += 0.03;

            const color = currentAura.color;
            const effect = currentAura.effect;

            // 1. 공통 광륜 글로우
            const grad = ctx.createRadialGradient(centerX, centerY, 20, centerX, centerY, 180);
            grad.addColorStop(0, color + 'aa');
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 180, 0, Math.PI * 2);
            ctx.fill();

            // 2. 오라별 특수 시각 파티클 로직
            if (effect === 'fireFlame' || effect === 'demonHellfire' || effect === 'darkBloodPillar') {
                // 불꽃 / 붉은 혈기 기둥
                if (Math.random() < 0.6) {
                    particles.push({
                        x: centerX + (Math.random() - 0.5) * 80,
                        y: centerY + 40,
                        vx: (Math.random() - 0.5) * 2,
                        vy: -Math.random() * 4 - 2,
                        size: Math.random() * 8 + 4,
                        life: 1, color
                    });
                }
            } else if (effect === 'swirlVortex' || effect === 'cosmicRings' || effect === 'rainbowPrism') {
                // 회오리 & 차원 고리
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(centerX, centerY, 90 + Math.sin(angleTick) * 10, angleTick, angleTick + Math.PI * 1.5);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(centerX, centerY, 130 + Math.cos(angleTick) * 10, -angleTick, -angleTick + Math.PI * 1.2);
                ctx.stroke();
            } else if (effect === 'cyberGlitch') {
                // 글리치 네온
                if (Math.random() < 0.4) {
                    ctx.fillStyle = Math.random() < 0.5 ? '#00ff66' : '#ff00ff';
                    ctx.fillRect(centerX + (Math.random() - 0.5) * 200, centerY + (Math.random() - 0.5) * 200, Math.random() * 20 + 5, 4);
                }
            } else if (effect === 'lightningSpark' || effect === 'absoluteRedStorm') {
                // 번개 폭풍
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.lineTo(centerX + (Math.random() - 0.5) * 240, centerY + (Math.random() - 0.5) * 240);
                    ctx.stroke();
                }
            } else if (effect === 'galaxyBigBang' || effect === 'whiteGodLight') {
                // 우주 빅뱅 / 신성 광채
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(centerX, centerY, 150 + Math.sin(angleTick * 2) * 20, 0, Math.PI * 2);
                ctx.stroke();
            }

            // 오비탈 회전 구체 생성
            if (Math.random() < 0.3) {
                particles.push({
                    x: centerX + Math.cos(angleTick * 2) * 100,
                    y: centerY + Math.sin(angleTick * 2) * 100,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    size: Math.random() * 6 + 3,
                    life: 1, color
                });
            }

            // 파티클 업데이트
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;

                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                if (p.life <= 0) particles.splice(i, 1);
            }
            ctx.globalAlpha = 1.0;

            requestAnimationFrame(renderCanvas);
        }

        renderCanvas();

        // 포션
        function applyBuff(luckMult, speedMult, duration) {
            if (activeBuff) clearInterval(activeBuff);
            luck = luckMult;
            autoDelay = 250 / speedMult;
            luckMultEl.innerText = `${luckMult}x (버프 중!)`;
            luckMultEl.style.color = "#ffaa00";

            let timer = duration;
            activeBuff = setInterval(() => {
                timer--;
                if (timer <= 0) {
                    clearInterval(activeBuff);
                    luck = 1.0; autoDelay = 250;
                    luckMultEl.innerText = "1.0x";
                    luckMultEl.style.color = "#00ffcc";
                    activeBuff = null;
                }
            }, 1000);
        }

        function buyPotion(type) {
            if (type === 'small') {
                if (gold < 100) { alert('골드가 부족합니다!'); return; }
                gold -= 100; goldValEl.innerText = gold.toLocaleString();
                applyBuff(2.0, 1.0, 15);
            }
        }

        function craftPotion(type) {
            if (type === 'large') {
                if (gold < 500 || !(inventory['Rare'] >= 1)) { alert('재료 부족!'); return; }
                gold -= 500; inventory['Rare']--; goldValEl.innerText = gold.toLocaleString();
                applyBuff(5.0, 1.0, 20);
            } else if (type === 'speed') {
                if (gold < 1000 || !(inventory['Glacier'] >= 1)) { alert('재료 부족!'); return; }
                gold -= 1000; inventory['Glacier']--; goldValEl.innerText = gold.toLocaleString();
                applyBuff(1.0, 3.0, 20);
            } else if (type === 'hyper') {
                if (gold < 5000 || !(inventory['Diaboli'] >= 1)) { alert('재료 부족!'); return; }
                gold -= 5000; inventory['Diaboli']--; goldValEl.innerText = gold.toLocaleString();
                applyBuff(20.0, 1.0, 10);
            }
        }

        // 이벤트
        rollBtn.addEventListener('click', roll);
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !isRolling && document.activeElement.tagName !== 'BUTTON') roll();
        });

        autoBtn.addEventListener('click', () => {
            isAuto = !isAuto;
            if (isAuto) {
                autoBtn.innerText = "Auto Roll: ON"; autoBtn.classList.add('active');
                if (!isRolling) roll();
            } else {
                autoBtn.innerText = "Auto Roll: OFF"; autoBtn.classList.remove('active');
            }
        });

        invBtn.addEventListener('click', () => {
            const listEl = document.getElementById('inv-list');
            listEl.innerHTML = '';
            AURAS.forEach(a => {
                const count = inventory[a.name] || 0;
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `<span style="color:${a.color}; font-weight:bold;">${a.name} (1/${a.chance.toLocaleString()})</span> <span>${count}개</span>`;
                listEl.appendChild(row);
            });
            invModal.style.display = 'flex';
        });

        shopBtn.addEventListener('click', () => shopModal.style.display = 'flex');
        closeInv.addEventListener('click', () => invModal.style.display = 'none');
        closeShop.addEventListener('click', () => shopModal.style.display = 'none');
    </script>
</body>
</html>
